{{define "pharmacy_row"}}<tr id="item-{{.ID}}" class="ph-row{{if .Err}} has-error{{end}}">
  <td class="cell-med" data-label="{{t "Лекарство"}}"><form id="f{{.ID}}" method="post" action="/pharmacy/items/{{.ID}}" hx-post="/pharmacy/items/{{.ID}}" hx-target="#item-{{.ID}}" hx-swap="outerHTML"></form><div class="med-cell"><strong class="med-name">{{.Name}}</strong><span class="med-sub muted">{{if .Substance}}{{.Substance}}{{end}}{{if and .Substance .Form}} · {{end}}{{.Form}}</span>{{if .Err}}<span class="error">{{.Err}}</span>{{end}}</div></td>
  <td class="cell-price" data-label="{{t "Цена, ₸"}}"><span class="price-wrap"><input form="f{{.ID}}" class="price-input" name="price" type="number" min="0" step="1" inputmode="numeric" value="{{.Price}}" aria-label="{{tf "Цена, ₸ (%s)" .Name}}" required><span class="price-unit" aria-hidden="true">₸</span></span></td>
  <td class="cell-stock" data-label="{{t "Наличие"}}"><label class="switch"><input form="f{{.ID}}" class="stock-input" name="in_stock" type="checkbox" value="1"{{if .InStock}} checked{{end}} aria-label="{{tf "В наличии (%s)" .Name}}" hx-post="/pharmacy/items/{{.ID}}" hx-trigger="change" hx-include="#item-{{.ID}} .price-input" hx-target="#item-{{.ID}}" hx-swap="outerHTML"><span class="switch-track" aria-hidden="true"></span><span class="switch-on">{{t "В наличии"}}</span><span class="switch-off">{{t "Нет в наличии"}}</span></label></td>
  <td class="cell-act"><div class="ph-actions"><button form="f{{.ID}}" class="btn btn-secondary btn-sm" type="submit">{{t "Сохранить"}}</button><button form="f{{.ID}}" class="btn btn-ghost btn-sm" type="submit" formaction="/pharmacy/items/{{.ID}}/delete" hx-post="/pharmacy/items/{{.ID}}/delete" hx-target="#item-{{.ID}}" hx-swap="outerHTML" hx-confirm="{{tf "Удалить «%s» (%s)?" .Name (money .Price)}}">{{t "Удалить"}}</button></div></td>
</tr>{{end}}
